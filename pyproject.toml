[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "skeepto"
version = "0.1.0"
description = "A real spreadsheet engine for Python — competitor to Excel and Google Sheets. Formulas, incremental recalc, and native .xlsx read/write via skeepto-engine. Not a DataFrame wrapper."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Stéphane ALLEZ" }]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.16"
wheel.packages = ["skeepto"]
build-dir = "build/{wheel_tag}"

# CPython 3.12 manylinux only for now. No musllinux / PyPy. No sdist here.
[tool.cibuildwheel]
build = "cp312-manylinux_x86_64"
skip = "pp* *-musllinux_*"
manylinux-x86_64-image = "manylinux_2_28"
build-verbosity = 1
archs = "x86_64"
test-requires = "pytest"
# Copy tests out of the repo: pytest adds rootdir to sys.path and the local
# skeepto/ package (no _core) would shadow the installed wheel.
test-command = "bash -c 'rm -rf /tmp/skeepto-tests && cp -a {project}/tests /tmp/skeepto-tests && cd /tmp/skeepto-tests && pytest -q'"

[tool.cibuildwheel.linux]
before-all = "bash {project}/scripts/cibw-before-all.sh"
environment = { SK_ENGINE_DIR = "/tmp/skeepto-engine", CMAKE_ARGS = "-DSK_ENGINE_DIR=/tmp/skeepto-engine -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF", CFLAGS = "-fPIC -fno-lto", CXXFLAGS = "-fPIC -fno-lto", LDFLAGS = "-fno-lto" }

[tool.pytest.ini_options]
testpaths = ["tests"]
